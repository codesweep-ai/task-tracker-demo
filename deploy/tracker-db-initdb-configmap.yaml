# GENERATED by deploy/gen-initdb-configmap.sh from src/main/resources/db/*.sql — do not edit by hand.
# Loaded by postgres in filename order (01-, 02-, 03-), mirroring the old compose mounts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tracker-db-initdb
data:
  01-schema.sql: |
    -- task-tracker schema (PostgreSQL)
    -- Loaded by the Postgres container at init time (docker-entrypoint-initdb.d);
    -- the app never creates its own schema.
    
    DROP TABLE IF EXISTS task;
    DROP TABLE IF EXISTS project;
    DROP TABLE IF EXISTS person;
    
    CREATE TABLE person (
      id        BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      username  VARCHAR(64)  NOT NULL UNIQUE,
      full_name VARCHAR(128) NOT NULL,
      password  VARCHAR(128) NOT NULL,
      role      VARCHAR(16)  NOT NULL
                CHECK (role IN ('ADMIN','MANAGER','MEMBER','VIEWER'))
    );
    
    CREATE TABLE project (
      id          BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      name        VARCHAR(128)  NOT NULL,
      description VARCHAR(1024),
      state       VARCHAR(16)   NOT NULL DEFAULT 'ACTIVE'
                  CHECK (state IN ('ACTIVE','ARCHIVED')),
      owner_id    BIGINT        NOT NULL,
      CONSTRAINT fk_project_owner FOREIGN KEY (owner_id) REFERENCES person(id)
    );
    
    CREATE TABLE task (
      id          BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
      title       VARCHAR(256)  NOT NULL,
      description VARCHAR(4000),
      status      VARCHAR(20)   NOT NULL DEFAULT 'OPEN'
                  CHECK (status IN ('OPEN','IN_PROGRESS','PENDING_APPROVAL','DONE')),
      priority    VARCHAR(16)   NOT NULL DEFAULT 'MEDIUM'
                  CHECK (priority IN ('LOW','MEDIUM','HIGH')),
      assignee_id BIGINT,
      project_id  BIGINT        NOT NULL,
      due_date    DATE,
      updated_at  TIMESTAMP     NOT NULL DEFAULT CURRENT_TIMESTAMP,  -- refreshed on every mutation
      CONSTRAINT fk_task_project  FOREIGN KEY (project_id)  REFERENCES project(id),
      CONSTRAINT fk_task_assignee FOREIGN KEY (assignee_id) REFERENCES person(id)
    );
  02-seed.sql: |
    -- Seed people (ids 1..4 via IDENTITY).
    INSERT INTO person (username, full_name, password, role) VALUES
      ('admin', 'Ada Admin',      'admin', 'ADMIN'),
      ('mgr',   'Morgan Manager', 'mgr',   'MANAGER'),
      ('dev',   'Devon Member',   'dev',   'MEMBER'),
      ('view',  'Vic Viewer',     'view',  'VIEWER');
    
    -- Projects (ids 1..3). owner_id references person.
    INSERT INTO project (name, description, state, owner_id) VALUES
      ('Apollo',        'Customer portal revamp',   'ACTIVE',   2),
      ('Borealis',      'Internal billing migration','ACTIVE',  1),
      ('Legacy Archive','Decommissioned in 2024',   'ARCHIVED', 1);
    
    -- Tasks spanning the full status lifecycle. updated_at is staggered a few hours
    -- apart so the default "recently updated" sort has an obvious, deterministic
    -- order (newest first) before any live mutation bumps a row to the top.
    INSERT INTO task (title, description, status, priority, assignee_id, project_id, due_date, updated_at) VALUES
      ('Design login page', 'Mockups + a11y pass',        'OPEN',             'HIGH',   3, 1, DATE '2026-06-15', TIMESTAMP '2026-07-15 09:00:00'),
      ('Wire up SSO',       'OIDC against corp IdP',       'IN_PROGRESS',      'HIGH',   3, 1, DATE '2026-06-20', TIMESTAMP '2026-07-15 12:00:00'),
      ('Migrate invoices',  'Port legacy invoice rows',    'PENDING_APPROVAL', 'MEDIUM', 3, 2, DATE '2026-06-10', TIMESTAMP '2026-07-15 15:00:00'),
      ('Archive old data',  'Cold-storage export',         'DONE',             'LOW',    1, 2, NULL,              TIMESTAMP '2026-07-15 18:00:00');
  03-oracle-ro.sql: |
    -- Read-only role (SELECT only; never mutates).
    -- Loaded by the Postgres container AFTER the schema/tables and seed
    -- (docker-entrypoint-initdb.d runs files in filename order: 01-schema, 02-seed,
    -- 03-oracle-ro), so GRANT ... ON ALL TABLES sees the tables that already exist.
    -- Recreated on every fresh `compose up`. Does NOT touch the app's own `tracker`
    -- owner role, the schema, or the seed data.
    
    CREATE ROLE oracle_ro LOGIN PASSWORD 'oracle_ro';
    GRANT CONNECT ON DATABASE tracker TO oracle_ro;
    GRANT USAGE ON SCHEMA public TO oracle_ro;
    GRANT SELECT ON ALL TABLES IN SCHEMA public TO oracle_ro;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO oracle_ro;
